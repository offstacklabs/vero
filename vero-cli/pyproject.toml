[project]
name = "vero-cli"
version = "0.1.0"
description = "Vero: Open-Source Headless Analytics Agent Framework & AI Data Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "litellm>=1.103.2",
    "mcp>=2.2.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "snowflake-sqlalchemy>=1.11.1",
    "sqlalchemy>=2.1.2",
    "sqlalchemy-bigquery>=1.17.3",
    "sqlglot>=30.21.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
vero = "vero.cli:app"

[project.urls]
Homepage = "https://verodata.dev"
Documentation = "https://docs.verodata.dev"

[tool.hatch.build.targets.wheel]
packages = ["vero"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
