name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Pytest Suite
        run: |
          cd vero-cli
          uv run pytest

  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vero-studio/package-lock.json

      - name: Install Dependencies
        run: |
          cd vero-studio
          npm ci

      - name: Run Linter (oxlint)
        run: |
          cd vero-studio
          npm run lint

      - name: Build Production Bundle
        run: |
          cd vero-studio
          npm run build

  test-sdk:
    name: React SDK Build (@verodata/react)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vero-sdk/package-lock.json

      - name: Install Dependencies
        run: |
          cd vero-sdk
          npm ci

      - name: Build SDK Bundle (tsup)
        run: |
          cd vero-sdk
          npm run build
